<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asset Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="lab-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">LOVE2D TOOLKIT</p>
        <h1>Asset Lab</h1>
      </div>
      <div class="topbar-actions">
        <span id="manifest-status" class="status-text">Loading manifest...</span>
        <button id="audio-button" class="small-button" type="button">Audio Library</button>
        <button id="reload-button" class="small-button" type="button">Refresh</button>
      </div>
    </header>

    <main class="lab-layout">
      <aside class="sidebar panel" aria-label="Asset browser">
        <div class="panel-heading">
          <div>
            <p class="section-label">BROWSE</p>
            <h2>Assets</h2>
          </div>
          <span id="asset-count" class="count-badge">0</span>
        </div>
        <div class="asset-browser-tools">
          <label class="sr-only" for="asset-search">Filter assets</label>
          <input id="asset-search" class="asset-search" type="search" placeholder="Filter assets..." autocomplete="off">
          <div class="asset-browser-actions">
            <button id="collapse-assets" class="small-button" type="button">Collapse</button>
            <button id="expand-assets" class="small-button" type="button">Expand</button>
          </div>
        </div>
        <div id="asset-tree" class="asset-tree"></div>
        <div id="asset-warnings" class="asset-warnings"></div>
      </aside>

      <section class="preview-panel panel" aria-label="Asset preview">
        <div class="preview-heading">
          <div>
            <p class="section-label">PREVIEW</p>
            <h2 id="preview-title">Select an asset</h2>
          </div>
          <span id="preview-kind" class="kind-badge">NONE</span>
        </div>
        <div id="preview-stage" class="preview-stage">
          <div class="empty-state">
            <span class="empty-icon">+</span>
            <p>Select an image or animation to inspect it.</p>
          </div>
        </div>
        <p id="preview-caption" class="preview-caption">The selected file will appear here.</p>
      </section>

      <aside class="inspector panel" aria-label="Asset inspector">
        <div id="inspector-empty" class="empty-state inspector-empty">
          <p>Select an asset from the browser.</p>
        </div>
        <div id="inspector-content" class="inspector-content" hidden></div>
      </aside>
    </main>

    <section class="audio-library panel" aria-label="Audio library">
      <div class="panel-heading">
        <div>
          <p class="section-label">AUDIO LIBRARY</p>
          <h2>Sound and music candidates</h2>
        </div>
        <span id="audio-count" class="count-badge">0</span>
      </div>
      <div id="audio-library-list" class="audio-library-list"></div>
    </section>
  </div>

  <script src="manifest.js"></script>
  <script src="audio_catalog.js"></script>
  <script src="lab.js"></script>
</body>
</html>
